<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08080c" />
    <meta name="description" content="RewindTv: catalogo retro, canal en vivo y guia de programacion." />
    <title>RewindTv</title>

    <!-- Mismo origen y sin credenciales: debe coincidir con el fetch() del adaptador. -->
    <link rel="preload" href="/data/titles.json" as="fetch" />
    <link rel="preload" href="/data/festivities.json" as="fetch" />
    <link rel="preload" href="/data/picks.json" as="fetch" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body class="bg-surface-0 text-ink-0 antialiased">
    <!-- Shell estatico: se pinta antes de que el JS arranque (sin FOUC ni layout shift). -->
    <div id="app" class="min-h-dvh flex flex-col">
      <div id="app-skeleton" class="flex-1 grid place-items-center">
        <div class="h-10 w-28 rounded bg-surface-2 animate-pulse"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
