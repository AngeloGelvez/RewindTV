services:
  - type: web
    name: rewindtv
    runtime: node
    branch: master
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: ">=22 <23"
      - key: HOST
        value: 0.0.0.0
